<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
      integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Weather App</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        width: 100%;
        height: 100vh;
        background-image: linear-gradient(to right top, #00d2fc, #00daf5, #00e1e9, #00e6d9, #12ebc5);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    
    }
    
    nav{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    nav img{
        width: 70px;
    }
    nav p{
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: 500;
        
        color: white;
    }
    main{
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto;
        border-radius: 29px;
        

        
    }
    main .MainContainer{    
        width: 50%;
        height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
        
    }
    .MainContainer input{
        width: 80%;
        height: 8vh;
        border-radius: 28px;
        border: 0.3px solid white;
        outline: none;
        text-align: center;
        background-image: linear-gradient(to right bottom, #00e1e9, #00e6d9, #12ebc5);
        font-size: 19px;
        color: white;
        
    }
    .MainContainer input::placeholder{
        color: white;
        font-size: 19px;
    }
    .MainContainer button{
        position: absolute;
        right: 34%;
        top: 19%;
        background-color: transparent;
        border: none;
        outline: none;
        font-size: 17px;
        color: white;
    }
    .MainContainer h1{
        font-size: 40px;
        color : rgb(235, 252, 3);
        margin: 5px;
    }
    .MainContainer p{
        color: rgb(255, 255, 255);
        font-size: 22px;
        margin-top: 25px;
        margin-bottom: 25px;
        font-weight: 500;
    }
    .SubContainer{
        
        width: 80%;
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        padding-left: 15px;
        
    }
   
   .SubContainer section h2{
    font-size: 20px;
    color: rgb(235, 252, 3);
    padding-left: 26px;
    
   }
   
   .wind{
    padding-left: 14px;
   }
   .press{
    padding-left: 14px;
   }
</style>
<body>
    <header>
        <nav>
            <img src="./logo.png" alt="Weather logo" >
            <p class="LogoTitle">Weather App</p>
        </nav>
    </header>
    <Main>
        <section class="MainContainer">
            <input type="text" id="text" name="text"  placeholder="Enter City name" >
            <button class="Search"><i class="fa fa-search"></i></button>
            <p class="cityname">---</p>
            <h1 class="Temperature">--ºC</h1>
            <p class="status">Status</p>
            <section class="SubContainer">
                <section class="hummidityContainer">
                    <h2 class="hummidity">--%</h2>
                    <p>Humidity</p>
                </section>
                <section class="pressureContainer">
                    <h2 class="pressure">--Pa</h2>
                    <p class="press">Pressure</p>
                </section>
                <section class="WindContainer">
                    <h2 class="WindSpeed">--KM/h</h2>
                    <p class="wind">WindSpeed</p>
                </section>
            </section>
        </section>
    </Main>
    <Footer></Footer>
</body>
<script src="./weather.js"></script>
</html>
